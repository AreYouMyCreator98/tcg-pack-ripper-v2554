name: Refresh verified card prices
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: card-price-backup
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh one-seventh of premium USD quotes from TCGdex
        run: node scripts/refresh-verified-card-prices.mjs
      - name: Validate the saved quote backup
        run: node scripts/validate-verified-card-prices.mjs
      - name: Publish the refreshed verified quote backup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/catalog/market-prices-usd.json
          if git diff --cached --quiet; then
            echo 'Quotes unchanged'
          else
            git commit -m 'chore(prices): refresh verified USD card quotes'
            git push
          fi
